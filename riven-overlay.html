<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Riven Overlay</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Rajdhani', sans-serif; 
      background: transparent; 
      color: #e4e6ea; 
      width: 320px; 
      height: 180px; 
      overflow: hidden;
      user-select: none;
      pointer-events: none;
    }
    #overlay-content {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
  </style>
</head>
<body>
  <div id="overlay-content"></div>
  <script>
    window.renderRivenOverlay = function(data) {
      const container = document.getElementById('overlay-content');
      if (data && data.html) {
        container.innerHTML = data.html;
      }
    };
  </script>
</body>
</html>
